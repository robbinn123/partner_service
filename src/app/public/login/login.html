<div class="row justify-content-center my-5 px-3">
  <div class="col-md-5">
    <div class="card card-corporativa bg-white overflow-hidden">
      <div class="navbar-partner text-center py-4 px-3 text-white">
        <img src="/partner_log_largo.png" alt="Partner Service" style="height: 48px; width: auto; object-fit: contain;" class="mb-2">
        <h5 class="fw-bold mb-0">Acceso Corporativo Partner Service</h5>
        <p class="small text-white-50 mb-0">Control de Asistencia — D.S. N.º 004-2006-TR</p>
      </div>

      <div class="p-4">
        <div *ngIf="errorLogin" class="alert alert-danger d-flex align-items-center py-2">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <div>{{ errorLogin }}</div>
        </div>

        <form [formGroup]="form" (ngSubmit)="ingresar()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Correo Corporativo</label>
            <input type="email" class="form-control" formControlName="correo" placeholder="usuario@partnerservice.pe">
            <div class="text-danger small mt-1" *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid">
              Ingrese un correo corporativo válido.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" class="form-control" formControlName="password" placeholder="••••••">
            <div class="text-danger small mt-1" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
              La contraseña es obligatoria (mínimo 4 caracteres).
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 mt-2">
            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
          </button>
        </form>

        <hr class="my-4">
        <p class="text-center small mb-0">
          ¿Nuevo ingreso? <a routerLink="/registro" class="fw-semibold">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>
