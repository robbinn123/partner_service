<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card card-corporativa p-4 bg-white">
      <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill text-primary me-2"></i>Alta de Colaborador</h4>
      <p class="text-muted small mb-3">Complete sus datos laborales y modalidad contractual.</p>

      <div *ngIf="mensajeError" class="alert alert-danger py-2">{{ mensajeError }}</div>
      <div *ngIf="mensajeExito" class="alert alert-success py-2">{{ mensajeExito }}</div>

      <form [formGroup]="form" (ngSubmit)="registrar()">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">DNI (8 dígitos)</label>
            <input type="text" maxlength="8" class="form-control" formControlName="dni" placeholder="72345678">
            <div class="text-danger small" *ngIf="form.get('dni')?.touched && form.get('dni')?.invalid">
              Ingrese 8 dígitos numéricos.
            </div>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Nombres</label>
            <input type="text" class="form-control" formControlName="nombres">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Apellidos</label>
            <input type="text" class="form-control" formControlName="apellidos">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Correo Corporativo</label>
            <input type="email" class="form-control" formControlName="correo" placeholder="nombre@asiscorp.pe">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Contraseña (mín. 6 caracteres)</label>
            <input type="password" class="form-control" formControlName="password">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Área / Departamento</label>
            <select class="form-select" formControlName="area">
              <option value="Sistemas">Sistemas y TI</option>
              <option value="Operaciones">Operaciones</option>
              <option value="Atención al Cliente">Atención al Cliente</option>
              <option value="Finanzas">Finanzas</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Modalidad de Jornada</label>
            <select class="form-select" formControlName="tipo_jornada">
              <option value="FULL_TIME">Full Time (8 horas)</option>
              <option value="SEMI_FULL">Semi Full (6 horas)</option>
              <option value="PART_TIME">Part Time (4 horas)</option>
            </select>
          </div>

          <div class="col-12 mt-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="leyDatos" formControlName="acepto_ley_datos">
              <label class="form-check-label small" for="leyDatos">
                Autorizo el tratamiento de mis datos personales y control de asistencia conforme a la <strong>Ley N.º 29733 (Ley de Protección de Datos Personales)</strong> y al <strong>D.S. N.º 004-2006-TR</strong>.
              </label>
            </div>
            <div class="text-danger small" *ngIf="form.get('acepto_ley_datos')?.touched && form.get('acepto_ley_datos')?.invalid">
              Debe aceptar el consentimiento de la Ley N.º 29733 para continuar.
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
          <a routerLink="/login" class="btn btn-outline-secondary">Volver al Login</a>
          <button type="submit" class="btn btn-primary fw-semibold px-4">Completar Registro</button>
        </div>
      </form>
    </div>
  </div>
</div>
